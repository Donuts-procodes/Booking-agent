[project]
name = "service-booking-platform"
version = "0.1.0"
description = "Universal Service Booking Assistant - FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",
    "pymilvus>=2.4.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "google-genai>=1.0.0",
    "redis[hiredis]>=5.2.0",
    "fastembed>=0.4.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
